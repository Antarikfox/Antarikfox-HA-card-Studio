name: Capture 4.0.5 documentation preview
on:
  push:
    branches: ['docs/dashboard-preview-4.0.5']
    paths: ['.github/workflows/capture-405-preview.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install screenshot driver
        run: npm install --prefix /tmp/afx-preview --no-save playwright
      - name: Render actual Glass Card code
        shell: bash
        run: |
          cat > /tmp/afx-preview/capture.cjs <<'JS'
          const {chromium}=require('playwright'), fs=require('fs');
          (async()=>{
          const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:1500,height:836},deviceScaleFactor:1});
          p.on('pageerror',e=>console.error(e));
          await p.setContent(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(ellipse at 27% 4%,#263047 0,transparent 52%),radial-gradient(ellipse at 93% 80%,#1d2632 0,transparent 50%),#0a101a;color:#e6edf7;font:15px system-ui,sans-serif;--primary-text-color:#e6edf7;--secondary-text-color:#a8b5c8;--primary-color:#8bd2ff;--divider-color:#344051;--card-background-color:#141c27;--ha-card-background:#141c27}header{display:flex;align-items:center;gap:22px;padding:18px 28px;border-bottom:1px solid #ffffff18;background:#0a111bd9}header b{font-size:19px;letter-spacing:.03em}header small{color:#8da3ba}header .badge{margin-left:auto;color:#a4e9bc;border:1px solid #477958;border-radius:30px;padding:5px 12px;font-size:11px;letter-spacing:.09em}main{padding:25px 32px 30px;max-width:1700px;margin:auto}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}h1{font-size:32px;font-weight:550;letter-spacing:-.04em;margin:0 0 4px}p{margin:0;color:#a0aec0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.column{display:flex;flex-direction:column;gap:17px;min-width:0}.section{color:#a1b2c7;font-size:12px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.section:after{content:'';height:1px;background:#ffffff1b;flex:1}.item{min-width:0}antarikfox-glass-card{display:block}footer{padding-top:20px;display:flex;justify-content:space-between;color:#8493a9;font-size:12px}ha-icon{display:inline-grid;place-items:center;width:24px;height:24px;font-size:19px;line-height:1}
          </style></head><body><header><b>◈ Antarikfox Studio</b><small>4.0.5 / GLASS CARD</small><span class="badge">SANDBOX · DEMO DATA</span></header><main><div class="intro"><div><h1>Home overview</h1><p>Standard Home Assistant cards, rebuilt with Antarikfox Glass</p></div><p>by Antarikfox</p></div><div class="grid" id="grid"></div><footer><span>Native Glass Card renderer · sample entities · no live devices</span><span>antarikfox.ru</span></footer></main></body></html>`);
          await p.addScriptTag({content:fs.readFileSync('dist/antarikfox-glass-card.js','utf8')});
          await p.evaluate(()=>{
          const A=window.AntarikfoxGlass;if(A.VERSION!=='4.0.5')throw Error('Unexpected Glass Card version');
          const icons={'mdi:lightbulb':'💡','mdi:thermometer':'🌡','mdi:water-percent':'💧','mdi:fan':'◉','mdi:window-shutter':'▥','mdi:lock':'🔒','mdi:music':'♫','mdi:television':'▣','mdi:power':'⏻','mdi:flash':'ϟ','mdi:play':'▶','mdi:pause':'Ⅱ','mdi:skip-next':'▸▸','mdi:skip-previous':'◂◂','mdi:volume-high':'◖))','mdi:volume-off':'◖×'};
          if(!customElements.get('ha-icon'))customElements.define('ha-icon',class extends HTMLElement{static get observedAttributes(){return ['icon']}set icon(v){this.setAttribute('icon',v)}get icon(){return this.getAttribute('icon')}connectedCallback(){this.paint()}attributeChangedCallback(){this.paint()}paint(){this.textContent=icons[this.getAttribute('icon')]||'◈'}});
          const states={};function s(id,state,attrs){states[id]={entity_id:id,state:String(state),attributes:attrs,last_changed:new Date().toISOString(),last_updated:new Date().toISOString()}}
          s('light.living_room','on',{friendly_name:'Living room',brightness:184,rgb_color:[255,164,72],supported_color_modes:['rgb'],color_mode:'rgb',icon:'mdi:lightbulb'});
          s('light.kitchen','on',{friendly_name:'Kitchen',brightness:121,rgb_color:[255,209,133],supported_color_modes:['rgb'],icon:'mdi:lightbulb'});
          s('switch.coffee','on',{friendly_name:'Coffee machine',icon:'mdi:power'});
          s('sensor.temperature','22.8',{friendly_name:'Indoor temperature',unit_of_measurement:'°C',device_class:'temperature',icon:'mdi:thermometer'});
          s('sensor.humidity','46',{friendly_name:'Humidity',unit_of_measurement:'%',device_class:'humidity',icon:'mdi:water-percent'});
          s('sensor.power','384',{friendly_name:'Power usage',unit_of_measurement:'W',device_class:'power',icon:'mdi:flash'});
          s('climate.living_room','heat',{friendly_name:'Heating',temperature:23,current_temperature:22.8,min_temp:16,max_temp:30,hvac_modes:['off','heat','cool'],hvac_action:'heating',icon:'mdi:thermometer'});
          s('cover.window','open',{friendly_name:'Bedroom window',current_position:65,supported_features:15,icon:'mdi:window-shutter'});
          s('fan.air','on',{friendly_name:'Air purifier',percentage:55,supported_features:1,icon:'mdi:fan'});
          s('lock.front_door','locked',{friendly_name:'Front door',icon:'mdi:lock'});
          s('media_player.living_room','playing',{friendly_name:'Living room audio',media_title:'Midnight Signals',media_artist:'Antarikfox Radio',volume_level:.42,media_duration:235,media_position:98,supported_features:65535,icon:'mdi:music'});
          s('binary_sensor.motion','off',{friendly_name:'Hall motion',device_class:'motion'});
          s('binary_sensor.leak','off',{friendly_name:'Water leak',device_class:'moisture'});
          const hass={states,entities:{},language:'en',locale:{language:'en'},user:{is_admin:true},hassUrl:p=>p,callService:()=>Promise.resolve(),callWS:()=>Promise.resolve([]),formatEntityState:so=>so.state};
          const columns=[['Lighting & comfort',[
          [{type:'light',entity:'light.living_room',name:'Living room'},'ember'],
          [{type:'tile',entity:'light.kitchen',name:'Kitchen lighting',features:[{type:'light-brightness'}]},'gold_luxe'],
          [{type:'thermostat',entity:'climate.living_room',name:'Heating'},'ice'],
          [{type:'button',entity:'switch.coffee',name:'Coffee machine',icon:'mdi:power',tap_action:{action:'toggle'}},'sunset']]],
          ['Climate & energy',[
          [{type:'sensor',entity:'sensor.temperature',name:'Indoor temperature'},'ocean'],
          [{type:'gauge',entity:'sensor.humidity',name:'Humidity',min:0,max:100},'forest'],
          [{type:'gauge',entity:'sensor.power',name:'Power usage',min:0,max:1000},'cyber'],
          [{type:'tile',entity:'fan.air',name:'Air purifier',features:[{type:'fan-speed'}]},'arctic']]],
          ['Media & security',[
          [{type:'media-control',entity:'media_player.living_room'},'synthwave'],
          [{type:'tile',entity:'cover.window',name:'Bedroom window',features:[{type:'cover-position'}]},'forest'],
          [{type:'entities',title:'Home security',entities:['lock.front_door','binary_sensor.motion','binary_sensor.leak']},'royal']]]];
          for(const [title,items] of columns){let col=document.createElement('section');col.className='column';let label=document.createElement('div');label.className='section';label.textContent=title;col.append(label);for(const [source,preset] of items){let {config}=A.convertCard(source,{mode:'rebuild',strip:false,hass});Object.assign(config,{preset,opacity:.42,glow_intensity:1.05,glow_spread:13,edge_width:1.5,radius:18,glare_intensity:.36,texture:config.texture||'noise',texture_opacity:.14,dim_inactive:false,ignite:false});let card=document.createElement('antarikfox-glass-card');card.preview=true;card.setConfig(config);card.hass=hass;let item=document.createElement('div');item.className='item';item.append(card);col.append(item)}document.getElementById('grid').append(col)}
          });
          await p.waitForTimeout(1800);
          if(await p.locator('antarikfox-glass-card').count()!==11)throw Error('Expected 11 converted cards');
          await p.screenshot({path:'docs/studio-4.0.5-dashboard.png',fullPage:true});
          await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/afx-preview/capture.cjs
      - name: Publish screenshot in release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/RELEASE-4.0.5.md')
          s=p.read_text()
          image='![11 standard Home Assistant cards rebuilt with Antarikfox Glass 4.0.5](studio-4.0.5-dashboard.png)'
          caption='Actual Glass Card renderer with demonstration entity states; the surrounding dashboard layout is a standalone documentation preview. / Реальный рендер карточек с демонстрационными данными, в отдельной панели для документации.'
          if image not in s:
              s=s.replace('## What\'s new',image+'\n\n'+caption+'\n\n## What\'s new',1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-4.0.5-dashboard.png docs/RELEASE-4.0.5.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual 4.0.5 dashboard render"
            git push origin HEAD:main
          fi
          for tag in v4.0.5 4.0.5; do
            if gh release view "$tag" --json body --jq .body > /tmp/afx-release-body.md 2>/dev/null; then
              if ! grep -q 'studio-4.0.5-dashboard.png' /tmp/afx-release-body.md; then
                printf '\n\n![Glass Card 4.0.5 dashboard demo](https://raw.githubusercontent.com/Antarikfox/Antarikfox-HA-card-Studio/main/docs/studio-4.0.5-dashboard.png)\n\nActual Glass Card renderer with demo entity states.\n' >> /tmp/afx-release-body.md
                gh release edit "$tag" --notes-file /tmp/afx-release-body.md
              fi
              break
            fi
          done
