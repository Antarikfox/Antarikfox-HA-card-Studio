<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antarikfox Studio</title>
<style>
:root{
  box-sizing:border-box;color-scheme:dark;
  --bg:#04060d;--panel:rgba(9,13,28,.92);--line:rgba(160,190,255,.14);--text:#e6eeff;--muted:rgba(200,215,255,.62);--accent:#7dd3fc;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#eef3fb;--panel:rgba(250,251,255,.95);--line:rgba(15,23,42,.12);--text:#0f172a;--muted:rgba(15,23,42,.6);--accent:#2563eb}}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:grid;grid-template-rows:auto 1fr;
  --primary-text-color:var(--text);--secondary-text-color:var(--muted);--divider-color:var(--line);--primary-color:var(--accent)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-right:auto}
.brand i{width:20px;height:20px;border-radius:7px;background:conic-gradient(from 200deg,#38bdf8,#22d3ee,#4ade80,#818cf8,#c084fc,#38bdf8);box-shadow:0 0 14px rgba(34,211,238,.6)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:rgba(127,127,127,.08);cursor:pointer;color:var(--text);font:inherit;font-size:13px}
.pill b{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.pill.ok b{background:#22c55e;box-shadow:0 0 8px #22c55e}
.pill.err b{background:#ef4444;box-shadow:0 0 8px #ef4444}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(127,127,127,.08);color:var(--text)}
.btn:hover{background:rgba(127,127,127,.16)}
.btn.hero{background:linear-gradient(120deg,#38bdf8,#818cf8 55%,#c084fc);color:#05070f;border:0}
.btn:focus-visible,.pill:focus-visible,.cardrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.mode{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.08)}
.mode button{all:unset;cursor:pointer;padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed=true]{background:var(--accent);color:#05070f}
.mode button.live[aria-pressed=true]{background:#ef4444;color:#fff}
main{display:grid;grid-template-columns:230px minmax(0,1fr) 420px;min-height:0}
@media (max-width:1180px){main{grid-template-columns:1fr}}
aside.list,aside.ed{background:var(--panel);overflow:auto;overflow-x:hidden;padding:14px;min-width:0}
aside.list{border-right:1px solid var(--line)}
aside.ed{border-left:1px solid var(--line)}
@media (max-width:1180px){
  html,body{height:auto}
  body{display:block}
  header{position:relative}
  main{display:flex;flex-direction:column}
  aside.list,aside.ed{overflow:visible;border:0;border-top:1px solid var(--line)}
  aside.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 10px;align-content:start}
  aside.list h2{grid-column:1/-1}
  aside.list #cards{display:contents}
  main .stage{position:sticky;top:0;z-index:15;max-height:58vh;padding:14px;border-bottom:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
}
h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
.cardrow{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.cardrow .nm{all:unset;flex:1;min-width:0;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardrow .nm:hover{background:rgba(127,127,127,.1)}
.cardrow.sel .nm{background:color-mix(in srgb,var(--accent) 20%,transparent);font-weight:600}
.brand .by{margin-left:6px;font-size:11.5px;font-weight:700;text-decoration:none;letter-spacing:.02em;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .by:hover{filter:brightness(1.25)}
.tipline{max-width:min(560px,100%);font-size:13px;line-height:1.45;color:rgba(220,230,255,.82);text-align:center;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(160,190,255,.12);transition:opacity .4s}
.tipline b{color:#a5d8ff;margin-right:6px}
.credit{order:99;display:grid;gap:4px;margin:18px 0 6px;padding:12px;border-radius:14px;text-align:center;
  background:linear-gradient(135deg,rgba(56,189,248,.10),rgba(167,139,250,.10),rgba(244,114,182,.10));border:1px solid var(--line)}
.credit a{display:grid;gap:2px;text-decoration:none;color:inherit}
.credit a b{font-size:16px;letter-spacing:.08em;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.credit a span{font-size:12px;color:var(--accent)}
.credit small{font-size:11px;color:var(--muted)}
.modal.gmodal .box{width:min(860px,100%);max-height:88vh;overflow:hidden;grid-template-rows:auto auto 1fr auto}
.gbody{overflow:auto;display:grid;gap:8px;padding-right:4px}
.gbody details{border:1px solid var(--line);border-radius:14px;background:rgba(127,127,127,.05)}
.gbody summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;list-style:none;display:flex;gap:10px;align-items:center}
.gbody summary::-webkit-details-marker{display:none}
.gbody summary::after{content:'▾';margin-left:auto;opacity:.6;transition:transform .2s}
.gbody details[open] summary::after{transform:rotate(180deg)}
.gbody ol{margin:0;padding:0 16px 14px 34px;display:grid;gap:8px;font-size:13.5px;line-height:1.5}
.gbody mark{background:rgba(250,204,21,.35);color:inherit;border-radius:3px}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.gfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.cardrow .nm small{display:block;font-size:11px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.stage[data-bg=dark]{background:#05070d!important}
.stage[data-bg=light]{background:#eef2f8!important}
.stage[data-bg=checker]{background:repeating-conic-gradient(#2a2f3a 0 25%,#1b1f27 0 50%) 0 0/24px 24px!important}
.dlist{display:grid;gap:4px;max-height:44vh;overflow:auto}
.dlist button{all:unset;box-sizing:border-box;padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13.5px;border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlist button:hover,.dlist button:focus-visible{background:rgba(127,127,127,.14);outline:none}
.dlist button small{color:var(--muted)}
.cardrow .ic{all:unset;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px}
.cardrow .ic:hover{background:rgba(127,127,127,.14);color:var(--text)}
.stage{position:relative;overflow:auto;padding:28px;display:flex;flex-direction:column;align-items:center;gap:18px;
  background:radial-gradient(900px 600px at 15% -10%,rgba(37,99,235,.35),transparent 62%),radial-gradient(700px 520px at 100% 30%,rgba(124,58,237,.28),transparent 60%),#04060d;color:#eaf2ff}
.stagebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:rgba(220,230,255,.75);align-self:stretch;justify-content:center}
.stagebar input[type=range]{accent-color:#7dd3fc}
.pvbox{width:var(--pvw,380px);max-width:100%;transition:width .2s}
.msg{font-size:13px;color:#fca5a5;max-width:420px;text-align:center}
.ycap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.ycap span.bt{display:flex;gap:6px;flex-wrap:wrap}
pre{margin:0;padding:12px;border-radius:12px;background:#0a1022;border:1px solid var(--line);font:12px/1.5 var(--mono);color:#cfe0ff;white-space:pre;overflow:auto;max-height:300px}
.modal,.modal.afx-ui{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(2,4,10,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{width:min(460px,100%);display:grid;gap:12px;padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin:0;font-size:17px}
.modal p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.stoast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#0c1328;color:#eaf2ff;border:1px solid rgba(160,190,255,.25);
  padding:10px 16px;border-radius:12px;font-size:13px;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
.stoast.show{opacity:1;transform:translate(-50%,0)}
ha-icon{display:inline-grid;place-items:center;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}
ha-icon svg{width:100%;height:100%;fill:currentColor}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Antarikfox Studio <small id="ver" style="font-weight:500;font-size:11px;opacity:.6"></small><a class="by" href="https://antarikfox.ru" target="_blank" rel="noopener">by Antarikfox</a></div>
  <button class="btn" id="guideBtn" type="button"></button>
  <button class="pill" id="conn" type="button"><b></b><span id="connTxt"></span></button>
  <span id="themeBox" class="afx-ui" style="min-width:210px"></span>
  <a class="btn" id="full" href="antarikfox-studio.html" target="_blank" rel="noopener" hidden>⤢</a>
  <div class="mode" role="group" id="langSeg"></div>
  <div class="mode" role="group" id="modeBox"><button type="button" data-m="sandbox" aria-pressed="true"></button><button type="button" class="live" data-m="live" aria-pressed="false"></button></div>
</header>
<main>
  <aside class="list">
    <h2 id="hCards"></h2>
    <div id="cards"></div>
    <button class="btn" id="newCard" type="button" style="width:100%;justify-content:center;margin-top:8px"></button>
    <button class="btn" id="impCard" type="button" style="width:100%;justify-content:center;margin-top:6px"></button>
    <button class="btn" id="openDash" type="button" style="width:100%;justify-content:center;margin-top:6px"></button>
    <div class="credit"><a href="https://antarikfox.ru" target="_blank" rel="noopener"><b>Antarikfox</b><span>antarikfox.ru</span></a><small>© <span id="yr"></span> Antarikfox · Antarikfox Glass</small></div>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="btn" id="bkp" type="button" style="flex:1;justify-content:center;font-size:12px"></button><button class="btn" id="rst" type="button" style="flex:1;justify-content:center;font-size:12px"></button></div>
  </aside>
  <section class="stage" id="stage">
    <div class="stagebar"><label><span id="wLbl"></span> <input type="range" id="pvw" min="260" max="760" step="10" value="380"></label><span id="wVal">380px</span><span id="bgBox" class="afx-ui" style="min-width:150px"></span><button class="btn" id="stTog" type="button" hidden></button></div>
    <div class="pvbox" id="pv"></div>
    <div class="msg" id="msg"></div>
    <div class="tipline" id="tipline" role="status"></div>
  </section>
  <aside class="ed">
    <antarikfox-glass-card-editor id="editor"></antarikfox-glass-card-editor>
    <div class="ycap"><span id="yCap"></span><span class="bt">
      <button class="btn" id="cp1" type="button"></button><button class="btn" id="cp2" type="button"></button><button class="btn" id="dl" type="button"></button>
    </span></div>
    <pre id="yaml"></pre>
    <div style="margin-top:12px;display:grid;gap:8px"><button class="btn hero" id="upd" type="button" style="width:100%;justify-content:center;background:linear-gradient(120deg,#22c55e,#14b8a6)" hidden></button><button class="btn hero" id="pub" type="button" style="width:100%;justify-content:center"></button></div>
  </aside>
</main>
<div class="stoast" id="toast" role="status"></div>

/* ═════════ Подключение к HA по WebSocket ═════════ */
class HAConn {
  constructor(url, token) { this.url = url; this.token = token; this.id = 1; this.pending = new Map(); }
  open() {
    return new Promise((resolve, reject) => {
      let ws;
      try { ws = new WebSocket(`${this.url.replace(/^http/, 'ws').replace(/\/+$/, '')}/api/websocket`); } catch (e) { reject(e); return; }
      this.ws = ws;
      let authed = false;
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'auth_required') { ws.send(JSON.stringify({ type: 'auth', access_token: this.token })); return; }
        if (m.type === 'auth_ok') { authed = true; this.version = m.ha_version; resolve(this); return; }
        if (m.type === 'auth_invalid') { reject(new Error('auth_invalid')); ws.close(); return; }
        if (m.type === 'result') { const p = this.pending.get(m.id); if (p) { this.pending.delete(m.id); if (m.success) p.res(m.result); else p.rej(new Error((m.error && (m.error.code || m.error.message)) || 'error')); } return; }
        if (m.type === 'event' && this.onEvent) this.onEvent(m.event);
      };
      ws.onerror = () => { if (!authed) reject(new Error('connect_failed')); };
      ws.onclose = () => { this.closed = true; this.pending.forEach((p) => p.rej(new Error('closed'))); this.pending.clear(); if (authed && this.onClose) this.onClose(); };
    });
  }
  call(msg) {
    return new Promise((res, rej) => {
      if (!this.ws || this.ws.readyState !== 1) { rej(new Error('closed')); return; }
      const id = this.id++;
      this.pending.set(id, { res, rej });
      this.ws.send(JSON.stringify({ ...msg, id }));
      setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); rej(new Error('timeout')); } }, 20000);
    });
  }
}
/** Токен: сессия HA с того же адреса (hassTokens) или долгосрочный токен из настроек */
async function getToken(url) {
  const manual = store.get('afx-studio-token', '');
  try {
    const tk = JSON.parse(localStorage.getItem('hassTokens') || 'null');
    if (tk && tk.access_token && (!tk.hassUrl || tk.hassUrl.replace(/\/+$/, '') === url.replace(/\/+$/, ''))) {
      if (!tk.expires || Date.now() < tk.expires - 30000) return tk.access_token;
      if (tk.refresh_token) {
        const r = await fetch(`${url.replace(/\/+$/, '')}/auth/token`, { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: tk.refresh_token, client_id: tk.clientId || `${url.replace(/\/+$/, '')}/` }) });
        if (r.ok) { const j = await r.json(); tk.access_token = j.access_token; tk.expires = Date.now() + j.expires_in * 1000; localStorage.setItem('hassTokens', JSON.stringify(tk)); return j.access_token; }
      }
    }
  } catch (e) { /* сессии нет */ }
  return manual || null;
}

  const url = defaultUrl();
  const token = await getToken(url);
  if (!token) { setStatus('off', t('connOff')); return false; }
  setStatus('off', t('connecting'));
  try {
    const c = new HAConn(url, token);
    await c.open();
    conn = c; retry = 0;
    const list = await c.call({ type: 'get_states' });
    states = Object.fromEntries(list.map((s) => [s.entity_id, s]));
    c.onEvent = (ev) => {
      const d = ev && ev.data;
      if (!d || !d.entity_id) return;
      states = { ...states };
      if (d.new_state) states[d.entity_id] = d.new_state; else delete states[d.entity_id];
      pushHass();
    };
    await c.call({ type: 'subscribe_events', event_type: 'state_changed' });
    c.onClose = () => { conn = null; setStatus('err', t('connOff')); setTimeout(connect, Math.min(30000, 2000 * ++retry)); };
    try { themes = await c.call({ type: 'frontend/get_themes' }); } catch (e) { themes = null; }
    buildThemeSelect();
    pushHass(true);
    setStatus('ok', t('connOk', c.version || '', Object.keys(states).length));
    return true;
  } catch (e) {
    setStatus('err', e.message === 'auth_invalid' ? t('connErr') : t('connOff'));
    return false;
  }
}

const OFFISH = new Set(['off', 'idle', 'standby', 'paused', 'closed', 'unavailable', 'unknown']);
function simulate(d, s, data) {

  if (key === 'homeassistant.toggle') n.state = OFFISH.has(n.state) ? (dom === 'media_player' ? 'on' : dom === 'cover' ? 'open' : 'on') : (dom === 'cover' ? 'closed' : 'off');
  else if (s === 'turn_on') { n.state = 'on'; if (data.brightness_pct != null) n.attributes.brightness = Math.round(data.brightness_pct * 2.55); if (data.effect) n.attributes.effect = data.effect; }
  else if (s === 'turn_off') n.state = 'off';
  else if (key === 'media_player.volume_set') n.attributes.volume_level = data.volume_level;
  else if (key === 'media_player.media_play_pause') n.state = n.state === 'playing' ? 'paused' : 'playing';
  else if (key === 'media_player.select_source') n.attributes.source = data.source;
  else if (s === 'select_option') n.state = data.option;
  else if (key === 'climate.set_temperature') n.attributes.temperature = data.temperature;
  else if (key === 'climate.set_hvac_mode') n.state = data.hvac_mode;
  else if (key === 'cover.set_cover_position') { n.attributes.current_position = data.position; n.state = data.position > 0 ? 'open' : 'closed'; }

  else if (key === 'lock.unlock') n.state = 'unlocked';
  else if (s === 'set_value') n.state = String(data.value);

  states = { ...states, [id]: n };
  pushHass(true);
  return true;
}
function callService(d, s, data = {}, target) {

  if (live && conn) {
    return conn.call({ type: 'call_service', domain: d, service: s, service_data: data, ...(target ? { target } : {}) })
      .then(() => toast(t('sent') + label)).catch((e) => toast(`⚠ ${label}: ${e.message}`));

}
const makeHass = () => ({

});

  if (!th) return;
  const vars = { ...th, ...((th.modes && th.modes.dark) || {}) };
  delete vars.modes;
  Object.entries(vars).forEach(([k, v]) => {
    if (/^card-mod/.test(k) || typeof v !== 'string') return;
    if (k === 'lovelace-background') { stage.style.background = v.replace(/\s+fixed\s*$/, ''); return; }
    stage.style.setProperty(`--${k}`, v); appliedVars.push(`--${k}`);

}

const mainEntity = (cfg) => {

};

async function updateOnDash() {

  try {
    const cfg = await conn.call({ type: 'lovelace/config', url_path: pl.url_path });
    const vw = cfg.views && cfg.views[pl.view];
    let pos = null;
    if (vw) {
      const at = cardAt(vw, pl);
      if (at && JSON.stringify(at) === pl.fp) pos = { sec: pl.sec, idx: pl.idx };
      else { const f = cardsOf(vw).find((x) => JSON.stringify(x.c) === pl.fp); if (f) pos = { sec: f.sec, idx: f.idx }; }
    }
    if (!pos) { confirmBox(t('movedQ'), t('add'), () => publish()); return; }
    const backup = JSON.parse(JSON.stringify(cfg));
    store.set(`afx-backup-${pl.url_path || 'default'}`, { t: Date.now(), config: backup });
    const card = JSON.parse(JSON.stringify(c.config));

function modal(build) {
  document.querySelectorAll('.modal').forEach((m) => m.remove());
  const ov = el('div', 'modal', { role: 'dialog', 'aria-modal': 'true' });
  const box = el('div', 'box afx-ui');
  ov.appendChild(box); document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
  ov.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  build(box, close);
  setTimeout(() => { const f = box.querySelector('input,button'); if (f) f.focus(); }, 30);
  return close;
}
function confirmBox(text, yesTxt, onYes) {

mSand.textContent = `🧪 ${t('sandbox')}`; mLive.textContent = `⚡ ${t('live')}`;
const setMode = (l) => { live = l; mSand.setAttribute('aria-pressed', String(!l)); mLive.setAttribute('aria-pressed', String(l)); if (l) toast(t('liveWarn')); };
mSand.addEventListener('click', () => setMode(false));
mLive.addEventListener('click', () => confirmBox(t('liveWarn'), t('live'), () => setMode(true)));
$('conn').addEventListener('click', settings);
$('newCard').addEventListener('click', () => {
  const n = { id: uid(), name: `${t('firstCard').split(' ')[0]} ${cards.length + 1}`, config: { type: 'custom:antarikfox-glass-card', preset: 'aurora', content: { padding: 16, gap: 12, blocks: [] } } };
  cards.push(n); selectCard(n.id);
  setTimeout(() => { const sec = editor.shadowRoot && editor.shadowRoot.querySelector('.sec[data-id=builder]'); if (sec) { if (!sec.classList.contains('open')) sec.querySelector('.sh').click(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }, 120);
});
$('impCard').addEventListener('click', () => editor.openImport());
$('openDash').textContent = t('openDash'); $('openDash').addEventListener('click', openFromDash);
$('upd').textContent = t('upd'); $('upd').addEventListener('click', updateOnDash);
$('bkp').textContent = t('bkp'); $('rst').textContent = t('rst');
$('bkp').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ studio: 'antarikfox', version: STUDIO_VERSION, saved: new Date().toISOString(), cards }, null, 2)], { type: 'application/json' }));
  a.download = `antarikfox-studio-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});
$('rst').addEventListener('click', () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', async () => {
    try {
      const j = JSON.parse(await inp.files[0].text());
      if (!j || j.studio !== 'antarikfox' || !Array.isArray(j.cards)) throw new Error('bad');
      const add = j.cards.filter((c) => c && c.config).map((c) => ({ ...c, id: uid() }));
      cards = cards.concat(add); save(); renderList(); toast(t('restored') + add.length);
    } catch (e) { toast(`⚠ ${t('badFile')}`); }
  });
  inp.click();
});
/* язык: явный выбор в шапке */
(() => {
  const box = $('langSeg'); let ov = null;
  try { ov = localStorage.getItem('afx-lang'); } catch (e) { /* без хранилища */ }
  [['', t('langAuto')], ['ru', 'RU'], ['en', 'EN'], ['zh', '中文'], ['ja', '日本語']].forEach(([v, txt]) => {
    const b = el('button', '', { type: 'button', text: txt, 'aria-pressed': String((ov || '') === v) });
    b.addEventListener('click', () => { try { if (v) localStorage.setItem('afx-lang', v); else localStorage.removeItem('afx-lang'); } catch (e) { /* без хранилища */ } location.reload(); });
    box.appendChild(b);
  });
  window.addEventListener('afx-lang-changed', () => location.reload());
})();
/* руководство и советы */
function openGuide(focus) {
  modal((box, close) => {
    box.parentElement.classList.add('gmodal');
    const head = el('div', 'row'); head.style.justifyContent = 'space-between';
    const cl = el('button', 'btn', { type: 'button', text: '✕', 'aria-label': t('close') }); cl.addEventListener('click', close);
    head.append(el('h3', '', { text: t('guideTitle') }), cl);
    const q = el('input', 'in', { type: 'search', placeholder: t('guideSearch'), 'aria-label': t('guideSearch') });
    q.style.cssText = 'width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.08);color:inherit;font:inherit';
    const body = el('div', 'gbody');
    const esc = (x) => x.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const render = () => {
      const f = q.value.trim().toLowerCase(); body.textContent = ''; let any = false;
      guideFor().forEach(([ic, title, tips], i) => {
        const hit = tips.filter((x) => !f || x.toLowerCase().includes(f) || title.toLowerCase().includes(f));
        if (!hit.length) return; any = true;
        const d = el('details'); d.open = !!f || i === (focus ?? 0);
        const sm = el('summary'); sm.append(el('span', '', { text: ic }), el('span', '', { text: title }));
        const ol = el('ol');
        hit.forEach((x) => { const li = el('li'); li.innerHTML = f ? esc(x).replace(new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (m) => `<mark>${m}</mark>`) : esc(x); ol.appendChild(li); });
        d.append(sm, ol); body.appendChild(d);
      });
      if (!any) body.appendChild(el('p', '', { text: t('nothingFound') }));
    };
    q.addEventListener('input', render); render();
    const foot = el('div', 'gfoot');
    const a = el('a', '', { href: SITE, target: '_blank', rel: 'noopener', text: 'antarikfox.ru' });
    foot.append(el('span', '', { text: `Antarikfox Glass ${AG.VERSION} · © ${new Date().getFullYear()} by Antarikfox` }), a);
    box.append(head, q, body, foot);
  });
}
$('guideBtn').textContent = t('guide'); $('guideBtn').addEventListener('click', () => openGuide());
$('yr').textContent = new Date().getFullYear();
(() => {
  const all = guideFor().flatMap(([ic, , tips], si) => tips.map((x) => [ic, x, si]));
  const line = $('tipline'); let k = Math.floor(Math.random() * all.length);
  const show = () => { const [ic, x, si] = all[k % all.length]; line.style.opacity = '0'; setTimeout(() => { line.innerHTML = ''; const b = el('b', '', { text: `${ic} ${t('tip')}:` }); line.append(b, document.createTextNode(` ${x}`)); line.dataset.sec = si; line.style.opacity = '1'; }, 250); k++; };
  line.style.cursor = 'pointer'; line.title = t('guide');
  line.addEventListener('click', () => openGuide(Number(line.dataset.sec) || 0));
  show(); setInterval(show, 20000);
})();
/* фон предпросмотра */
(() => {
  const bg = mkSelect([['theme', t('bgTheme')], ['dark', t('bgDark')], ['light', t('bgLight')], ['checker', t('bgChecker')]].map(([value, label]) => ({ value, label })),
    (v) => { if (v === 'theme') delete $('stage').dataset.bg; else $('stage').dataset.bg = v; store.set('afx-studio-bg', v); }, { label: t('bg') });
  const v0 = store.get('afx-studio-bg', 'theme'); bg.set(v0); if (v0 !== 'theme') $('stage').dataset.bg = v0;
  $('bgBox').appendChild(bg.el);
})();
/* Ctrl+S — сохранить на панель */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'ы' || e.code === 'KeyS')) { e.preventDefault(); const c = curCard(); if (c && c.placement) updateOnDash(); else publish(); }
});
$('pvw').addEventListener('input', (e) => { $('pv').style.setProperty('--pvw', `${e.target.value}px`); $('wVal').textContent = `${e.target.value}px`; });
$('cp1').addEventListener('click', async () => { if (await copyText($('yaml').textContent)) toast(t('copied')); else { const r = document.createRange(); r.selectNodeContents($('yaml')); getSelection().removeAllRanges(); getSelection().addRange(r); toast(t('select')); } });
$('cp2').addEventListener('click', () => toast(copyLegacy($('yaml').textContent) ? t('copied') : t('select')));
$('dl').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('yaml').textContent], { type: 'text/yaml' }));
  a.download = `${(curCard().name || 'card').replace(/[^\wа-яё-]+/gi, '_')}.yaml`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
});
$('pub').addEventListener('click', publish);
$('stTog').textContent = t('stTog'); $('stTog').title = t('stTogT');
$('stTog').addEventListener('click', () => { const e = mainEntity(curCard().config); if (!e || !states[e]) return; if (!simulate('homeassistant', 'toggle', { entity_id: e })) toast('—'); });
if (window.top !== window.self) { const f = $('full'); f.hidden = false; f.title = t('full'); f.setAttribute('aria-label', t('full')); }

$('ver').textContent = `v${STUDIO_VERSION} · card v${AG.VERSION}`;
if (AG.VERSION !== STUDIO_VERSION) setTimeout(() => toast(lang === 'ru' ? `⚠ Загружена старая карточка v${AG.VERSION}. Замените antarikfox-glass-card.js в /config/www/` : `⚠ Old card v${AG.VERSION} loaded. Replace antarikfox-glass-card.js in /config/www/`), 600);
setStatus('off', t('connecting'));
hass = makeHass(); editor.hass = hass;
selectCard(cur);
connect();
})();
</script>
